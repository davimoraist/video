<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nota Fácil</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="cabeca">
        <h1>Nota Fácil</h1>

        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome">

        <label for="materia">Matéria:</label>
        <input type="text" name="materia" id="materia">

        <label for="peso">Peso das questões:</label>
        <input type="text" name="peso" id="peso">

        <label for="total">Quantas questões você acertou?</label>
        <input type="text" name="total" id="total">

        <label for="prova">Total de questões na prova:</label>
        <input type="text" name="prova" id="prova">
        <br><br>
        <button onclick="calcularNota()">Calcular Nota</button>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
